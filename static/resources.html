<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mosaic Canvas — Resources</title>
    <style>
        :root {
            --bg: #0f1117;
            --bg-elevated: #1a1d28;
            --bg-hover: #252836;
            --border: #2a2d3a;
            --text: #d4d4d4;
            --text-dim: #85889a;
            --accent: #6c8eef;
            --accent-dim: #4a6a9e;
            --green: #4ec9b0;
            --yellow: #dcdcaa;
            --red: #f44747;
            --orange: #ce9178;
            --purple: #c586c0;
            --mono: 'SF Mono', 'Cascadia Code', 'Fira Code', Consolas, monospace;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            font-size: 14px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 10px 20px;
            background: var(--bg-elevated);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        header h1 { font-size: 18px; font-weight: 600; }
        header a {
            color: var(--accent);
            text-decoration: none;
            font-size: 13px;
        }
        header a:hover { text-decoration: underline; }
        .stats {
            margin-left: auto;
            display: flex;
            gap: 16px;
            font-size: 12px;
            color: var(--text-dim);
        }
        .stats span strong { color: var(--text); }

        .lang-switcher {
            position: relative;
            display: inline-flex;
        }
        .lang-switcher .lang-dropdown {
            display: none;
            position: absolute;
            top: 100%;
            right: 0;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 4px;
            flex-direction: column;
            z-index: 100;
            margin-top: 4px;
        }
        .lang-switcher.open .lang-dropdown { display: flex; }
        .lang-switcher .lang-option {
            background: none;
            border: none;
            color: var(--text);
            padding: 8px 16px;
            cursor: pointer;
            font-size: 13px;
            text-align: left;
            border-radius: 3px;
        }
        .lang-switcher .lang-option:hover { background: var(--bg-hover); }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 20px;
            background: var(--bg-elevated);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .toolbar button, .toolbar select, .toolbar input {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
        .toolbar button:hover { border-color: var(--accent); }
        .toolbar button.active { border-color: var(--accent); color: var(--accent); }
        .toolbar select { cursor: pointer; }
        .toolbar input {
            flex: 1;
            max-width: 300px;
        }
        .toolbar .spacer { flex: 1; }
        .toolbar .batch-actions { display: none; gap: 8px; }
        .toolbar .batch-actions.visible { display: flex; }
        .toolbar .batch-actions button { font-size: 12px; }
        .toolbar .batch-actions button.delete { border-color: var(--red); color: var(--red); }

        .main {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
        }
        .resource-card {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: border-color 0.15s, transform 0.1s;
            position: relative;
        }
        .resource-card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }
        .resource-card.selected {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent-dim);
        }
        .resource-card .checkbox {
            position: absolute;
            top: 8px;
            left: 8px;
            width: 22px;
            height: 22px;
            border-radius: 4px;
            border: 2px solid var(--border);
            background: rgba(0,0,0,0.5);
            cursor: pointer;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: white;
        }
        .resource-card.selected .checkbox {
            background: var(--accent);
            border-color: var(--accent);
        }
        .resource-card .preview {
            width: 100%;
            height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            overflow: hidden;
            position: relative;
        }
        .resource-card .preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .resource-card .preview video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .resource-card .preview .icon {
            font-size: 48px;
            opacity: 0.5;
        }
        .resource-card .preview .type-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0,0,0,0.7);
            color: var(--text);
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 10px;
            text-transform: uppercase;
            font-weight: 600;
        }
        .resource-card .info {
            padding: 8px 12px;
            font-size: 12px;
        }
        .resource-card .info .filename {
            font-family: var(--mono);
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 11px;
        }
        .resource-card .info .meta {
            color: var(--text-dim);
            margin-top: 4px;
            display: flex;
            justify-content: space-between;
        }
        .resource-card .actions {
            display: flex;
            gap: 6px;
            padding: 0 12px 8px;
        }
        .resource-card .actions button {
            flex: 1;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text-dim);
            padding: 4px 8px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 11px;
        }
        .resource-card .actions button:hover { color: var(--text); border-color: var(--accent); }
        .resource-card .actions button.delete:hover { color: var(--red); border-color: var(--red); }

        .empty {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-dim);
            font-size: 16px;
        }
        .empty .icon { font-size: 48px; display: block; margin-bottom: 12px; opacity: 0.3; }

        .lightbox {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }
        .lightbox.visible { display: flex; }
        .lightbox-content {
            max-width: 90vw;
            max-height: 90vh;
            position: relative;
        }
        .lightbox-content img, .lightbox-content video {
            max-width: 90vw;
            max-height: 85vh;
            border-radius: 8px;
        }
        .lightbox-content .close {
            position: absolute;
            top: -30px;
            right: 0;
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }
        .lightbox-content .lb-info {
            color: var(--text-dim);
            font-size: 12px;
            margin-top: 8px;
            text-align: center;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-dim);
        }
    </style>
</head>
<body>
    <header>
        <h1 data-i18n="resources.title">🖼️ Mosaic Canvas Resources</h1>
        <a href="/" data-i18n="resources.back_to_canvas">← Back to Canvas</a>
        <div class="stats" id="stats"></div>
        <div class="lang-switcher" id="lang-switcher">
            <button id="btn-lang" style="background:var(--bg);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:4px;cursor:pointer;font-size:13px;">
                <span id="lang-label">EN</span>
            </button>
            <div class="lang-dropdown" id="lang-dropdown">
                <button class="lang-option" data-lang="en">🇬🇧 English</button>
                <button class="lang-option" data-lang="zh">🇨🇳 中文</button>
            </div>
        </div>
    </header>

    <div class="toolbar">
        <button class="active" data-type="" onclick="filterType('')" data-i18n="resources.all">All</button>
        <button data-type="image" onclick="filterType('image')">🖼️ <span data-i18n="resources.images">Images</span></button>
        <button data-type="video" onclick="filterType('video')">🎬 <span data-i18n="resources.videos">Videos</span></button>
        <button data-type="audio" onclick="filterType('audio')">🎵 <span data-i18n="resources.audio">Audio</span></button>
        <button data-type="subtitle" onclick="filterType('subtitle')">📝 <span data-i18n="resources.subtitles">Subtitles</span></button>
        <button data-type="other" onclick="filterType('other')">📄 <span data-i18n="resources.other">Other</span></button>
        <input type="text" id="search" data-i18n-placeholder="resources.search_placeholder" placeholder="Search files..." oninput="applyFilter()">
        <select id="sort-select" onchange="loadResources()">
            <option value="modified-desc" data-i18n="resources.sort_newest">Newest first</option>
            <option value="modified-asc" data-i18n="resources.sort_oldest">Oldest first</option>
            <option value="name-asc" data-i18n="resources.sort_name_az">Name A-Z</option>
            <option value="name-desc" data-i18n="resources.sort_name_za">Name Z-A</option>
            <option value="size-desc" data-i18n="resources.sort_largest">Largest first</option>
            <option value="size-asc" data-i18n="resources.sort_smallest">Smallest first</option>
        </select>
        <div class="spacer"></div>
        <div class="batch-actions" id="batch-actions">
            <span id="batch-count" style="color:var(--accent);font-size:12px;">0 selected</span>
            <button onclick="downloadSelected()" data-i18n="resources.download_selected">⬇ Download Selected</button>
            <button class="delete" onclick="deleteSelected()" data-i18n="resources.delete_selected">🗑 Delete Selected</button>
            <button onclick="clearSelection()" data-i18n="resources.cancel">Cancel</button>
        </div>
        <button onclick="refresh()" data-i18n="resources.refresh">🔄 Refresh</button>
        <button onclick="cleanupOld()" data-i18n-title="resources.cleanup_title" data-i18n="resources.cleanup">🧹 Cleanup</button>
    </div>

    <div class="main">
        <div class="grid" id="grid">
            <div class="loading" data-i18n="resources.loading">Loading...</div>
        </div>
    </div>

    <div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
        <div class="lightbox-content" onclick="event.stopPropagation()">
            <button class="close" onclick="closeLightbox()">✕</button>
            <div id="lightbox-media"></div>
            <div class="lb-info" id="lightbox-info"></div>
        </div>
    </div>

    <script src="/static/js/i18n.js"></script>
    <script src="/static/js/api.js"></script>
    <script>
        let currentType = '';
        let allResources = [];
        let selectedFiles = new Set();

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function escapeAttr(text) {
            return String(text).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function t(key) { return I18n.t(key); }

        function formatTime(iso) {
            const d = new Date(iso);
            const now = new Date();
            const diff = (now - d) / 1000;
            if (diff < 60) return t('resources.time_just_now');
            if (diff < 3600) return Math.floor(diff/60) + t('resources.time_minutes_ago');
            if (diff < 86400) return Math.floor(diff/3600) + t('resources.time_hours_ago');
            if (diff < 604800) return Math.floor(diff/86400) + t('resources.time_days_ago');
            return d.toLocaleDateString();
        }

        function getIcon(type) {
            const icons = {
                image: '🖼️', video: '🎬', audio: '🎵',
                subtitle: '📝', other: '📄',
            };
            return icons[type] || '📄';
        }

        async function loadStats() {
            try {
                const stats = await API.getResourceStats();
                const parts = [];
                parts.push(`<span><strong>${stats.total_count}</strong> ${t('resources.files')}</span>`);
                parts.push(`<span><strong>${stats.total_size_human}</strong> ${t('resources.total')}</span>`);
                for (const [type, info] of Object.entries(stats.by_type_human || {})) {
                    parts.push(`<span>${getIcon(type)} <strong>${info.count}</strong> (${info.size_human})</span>`);
                }
                document.getElementById('stats').innerHTML = parts.join('');
            } catch (e) {
                console.error('Stats error:', e);
            }
        }

        async function loadResources() {
            const sortSelect = document.getElementById('sort-select').value;
            const [sort, order] = sortSelect.split('-');
            try {
                const data = await API.listResources(currentType || null, sort, order);
                allResources = data.resources || [];
                applyFilter();
            } catch (e) {
                document.getElementById('grid').innerHTML = `<div class="empty">${t('resources.error')}: ${escapeHtml(e.message)}</div>`;
            }
        }

        function applyFilter() {
            const search = document.getElementById('search').value.toLowerCase();
            const filtered = allResources.filter(r =>
                !search || r.filename.toLowerCase().includes(search)
            );

            if (filtered.length === 0) {
                document.getElementById('grid').innerHTML = `
                    <div class="empty" style="grid-column:1/-1">
                        <span class="icon">${currentType ? getIcon(currentType) : '📂'}</span>
                        ${t('resources.no_resources')}${search ? ' ' + t('resources.matching').replace('{search}', escapeHtml(search)) : ''}
                    </div>`;
                return;
            }

            document.getElementById('grid').innerHTML = filtered.map(r => {
                const isSelected = selectedFiles.has(r.filename);
                let preview = '';
                if (r.type === 'image') {
                    preview = `<img src="${escapeAttr(r.url)}" loading="lazy" alt="${escapeAttr(r.filename)}" />`;
                } else if (r.type === 'video') {
                    preview = `<video src="${escapeAttr(r.url)}" preload="metadata" controls></video>`;
                } else if (r.type === 'audio') {
                    preview = `<div class="resource-audio-preview"><audio controls src="${escapeAttr(r.url)}" class="resource-audio-mini" preload="none"></audio></div>`;
                } else {
                    preview = `<div class="icon">${getIcon(r.type)}</div>`;
                }

                return `
                <div class="resource-card ${isSelected ? 'selected' : ''}" data-filename="${escapeAttr(r.filename)}" data-url="${escapeAttr(r.url)}" data-type="${escapeAttr(r.type)}">
                    <div class="checkbox" data-action="select" data-filename="${escapeAttr(r.filename)}">${isSelected ? '✓' : ''}</div>
                    <div class="preview" data-action="lightbox" data-filename="${escapeAttr(r.filename)}" data-url="${escapeAttr(r.url)}" data-type="${escapeAttr(r.type)}">
                        ${preview}
                        <span class="type-badge">${escapeHtml(r.type)}</span>
                    </div>
                    <div class="info">
                        <div class="filename" title="${escapeAttr(r.filename)}">${escapeHtml(r.filename)}</div>
                        <div class="meta">
                            <span>${escapeHtml(r.size_human)}</span>
                            <span>${escapeHtml(formatTime(r.modified))}</span>
                        </div>
                    </div>
                    <div class="actions">
                        <button data-action="download" data-url="${escapeAttr(r.url)}" data-filename="${escapeAttr(r.filename)}">⬇ ${t('resources.download')}</button>
                        <button class="delete" data-action="delete" data-filename="${escapeAttr(r.filename)}">🗑 ${t('resources.delete')}</button>
                    </div>
                </div>`;
            }).join('');

            // Attach event listeners via delegation (avoids XSS from inline onclick)
            attachCardListeners();
        }

        function attachCardListeners() {
            document.querySelectorAll('.resource-card').forEach(card => {
                card.querySelectorAll('[data-action]').forEach(el => {
                    el.onclick = (e) => {
                        e.stopPropagation();
                        const action = el.dataset.action;
                        const filename = el.dataset.filename;
                        const url = el.dataset.url;
                        const type = el.dataset.type;
                        if (action === 'select') toggleSelect(filename);
                        else if (action === 'lightbox') openLightbox(filename, url, type);
                        else if (action === 'download') downloadFile(url, filename);
                        else if (action === 'delete') deleteFile(filename);
                    };
                });
            });
        }

        function filterType(type) {
            currentType = type;
            document.querySelectorAll('.toolbar button[data-type]').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.type === type);
            });
            loadResources();
        }

        function toggleSelect(filename) {
            if (selectedFiles.has(filename)) {
                selectedFiles.delete(filename);
            } else {
                selectedFiles.add(filename);
            }
            updateBatchActions();
            applyFilter();
        }

        function updateBatchActions() {
            const batchEl = document.getElementById('batch-actions');
            const countEl = document.getElementById('batch-count');
            if (selectedFiles.size > 0) {
                batchEl.classList.add('visible');
                countEl.textContent = `${selectedFiles.size} ${t('resources.selected')}`;
            } else {
                batchEl.classList.remove('visible');
            }
        }

        function clearSelection() {
            selectedFiles.clear();
            updateBatchActions();
            applyFilter();
        }

        async function deleteFile(filename) {
            if (!confirm(t('resources.confirm_delete').replace('{filename}', filename))) return;
            try {
                const result = await API.deleteResource(filename);
                if (result.success) {
                    selectedFiles.delete(filename);
                    loadResources();
                    loadStats();
                    updateBatchActions();
                } else {
                    alert(t('resources.delete_failed') + ': ' + result.message);
                }
            } catch (e) {
                alert(t('resources.delete_failed') + ': ' + e.message);
            }
        }

        async function deleteSelected() {
            if (selectedFiles.size === 0) return;
            if (!confirm(t('resources.confirm_delete_multiple').replace('{count}', selectedFiles.size))) return;
            try {
                const result = await API.deleteResourcesBulk([...selectedFiles]);
                alert(t('resources.deleted_count').replace('{count}', result.deleted_count) +
                      (result.failed_count > 0 ? ', ' + t('resources.failed_count').replace('{count}', result.failed_count) : ''));
                selectedFiles.clear();
                updateBatchActions();
                loadResources();
                loadStats();
            } catch (e) {
                alert(t('resources.bulk_delete_failed') + ': ' + e.message);
            }
        }

        function downloadFile(url, filename) {
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            a.remove();
        }

        function downloadSelected() {
            for (const filename of selectedFiles) {
                const r = allResources.find(r => r.filename === filename);
                if (r) downloadFile(r.url, r.filename);
            }
        }

        function openLightbox(filename, url, type) {
            const lb = document.getElementById('lightbox');
            const media = document.getElementById('lightbox-media');
            const info = document.getElementById('lightbox-info');
            if (type === 'image') {
                media.innerHTML = `<img src="${escapeAttr(url)}" alt="${escapeAttr(filename)}" />`;
            } else if (type === 'video') {
                media.innerHTML = `<video src="${escapeAttr(url)}" controls autoplay></video>`;
            } else if (type === 'audio') {
                media.innerHTML = `<audio src="${escapeAttr(url)}" controls autoplay style="width:400px;margin:20px 0;"></audio>`;
            } else {
                media.innerHTML = `<div style="color:white;font-size:48px;text-align:center;padding:60px;">${getIcon(type)}</div>`;
            }
            const r = allResources.find(r => r.filename === filename);
            info.textContent = `${filename} — ${r ? r.size_human : ''}`;
            lb.classList.add('visible');
        }

        function closeLightbox(event) {
            if (event && event.target.closest('.lightbox-content') && !event.target.classList.contains('close')) return;
            const lb = document.getElementById('lightbox');
            lb.classList.remove('visible');
            const media = document.getElementById('lightbox-media');
            media.innerHTML = '';
        }

        async function cleanupOld() {
            if (!confirm(t('resources.confirm_cleanup'))) return;
            try {
                const result = await API.cleanupResources(30, 500);
                alert(t('resources.cleanup_complete').replace('{deleted}', result.deleted_count).replace('{remaining}', result.remaining_count));
                loadResources();
                loadStats();
            } catch (e) {
                alert(t('resources.cleanup_failed') + ': ' + e.message);
            }
        }

        function refresh() {
            loadStats();
            loadResources();
        }

        // Language switcher
        function initLangSwitcher() {
            const switcher = document.getElementById('lang-switcher');
            const btn = document.getElementById('btn-lang');
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                switcher.classList.toggle('open');
            });
            document.addEventListener('click', () => switcher.classList.remove('open'));
            document.querySelectorAll('.lang-option').forEach(opt => {
                opt.addEventListener('click', () => {
                    I18n.setLang(opt.dataset.lang);
                    switcher.classList.remove('open');
                });
            });
            I18n.on(() => updateLangUI());
            updateLangUI();
        }

        function updateLangUI() {
            const lang = I18n.getLang();
            document.getElementById('lang-label').textContent = lang === 'zh' ? '中文' : 'EN';
            document.documentElement.lang = lang;
            I18n.applyToDOM();
            // Re-render dynamic content
            loadStats();
            applyFilter();
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (document.getElementById('lightbox').classList.contains('visible')) {
                    closeLightbox();
                } else if (selectedFiles.size > 0) {
                    clearSelection();
                }
            }
        });

        // Init
        initLangSwitcher();
        loadStats();
        loadResources();
        setInterval(loadStats, 30000);
    </script>
</body>
</html>
